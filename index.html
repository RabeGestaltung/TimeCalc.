<title>Zeitprotokoll</title>
<style>
  :root {
    --bg: #F3F4F6; --card: #FFFFFF; --line: #E5E7EB; --line2: #D1D5DB;
    --ink: #1C1F24; --muted: #6B7280; --soft: #EEF0F3;
    --amber: #E3A23C; --red: #E2665A; --red2: #D9483B; --green: #3FA35E;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
  body { min-height: 100vh; padding-top: env(safe-area-inset-top, 0px); }
  button, input, select, textarea { font-family: inherit; }
  .mono { font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; font-variant-numeric: tabular-nums; }
  .app { max-width: 560px; margin: 0 auto; padding: 0 20px 170px; }

  .topbar { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; justify-content: space-between; padding: 12px 0; background: var(--bg); }
  .icon-btn { width: 42px; height: 42px; border-radius: 50%; border: none; background: var(--card); color: var(--ink); display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 1px 2px rgba(0,0,0,.06); }
  .topbar-brand { font-size: 14px; font-weight: 600; letter-spacing: .02em; }
  .topbar-spacer { width: 42px; }
  .topbar { position: sticky; }
  .topbar-brand { transition: opacity .2s; }
  .topbar.searching .topbar-brand { opacity: 0; }
  .sbox { position: absolute; left: 54px; top: 50%; transform: translateY(-50%); height: 42px; width: 42px; display: flex; align-items: center; justify-content: flex-end; border-radius: 21px; background: transparent; overflow: hidden; transition: width .25s ease, background .25s ease; z-index: 2; }
  .sbox.open { width: calc(100% - 108px); }
  .sbox input { flex: 1; min-width: 0; width: 0; height: 100%; border: none; outline: none; background: transparent; font-size: 16px; color: var(--ink); padding: 0 0 0 14px; opacity: 0; transition: opacity .2s; }
  .sbox.open input { opacity: 1; }
  .sbox .s-btn { width: 42px; height: 42px; flex-shrink: 0; border: none; background: var(--card); color: var(--ink); display: flex; align-items: center; justify-content: center; cursor: pointer; border-radius: 50%; box-shadow: 0 1px 2px rgba(0,0,0,.06); }
  .sbox.open { background: var(--card); box-shadow: 0 1px 2px rgba(0,0,0,.06); }
  .sbox.open .s-btn { background: transparent; box-shadow: none; }
  .sr { display: flex; align-items: center; gap: 12px; padding: 12px 14px; cursor: pointer; }
  .sr .sr-main { flex: 1; min-width: 0; }
  .sr .sr-title { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sr .sr-sub { font-size: 12px; color: var(--muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  h1 { font-size: 30px; font-weight: 700; letter-spacing: -.02em; margin: 8px 0 2px; }
  .sub { color: var(--muted); font-size: 14px; margin: 0 0 22px; }
  .hint { font-size: 12px; color: var(--muted); margin: -10px 0 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; width: 100%; text-align: left; color: var(--ink); }
  .gh { cursor: default; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }

  .timer-card { padding: 22px; margin-bottom: 28px; border-left: 4px solid var(--line2); }
  .timer-card.running { border-left-color: var(--amber); }
  .status { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-bottom: 8px; }
  .timer-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
  .running-label { display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 600; }
  .dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; display: inline-block; }
  .pulse { animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
  @media (prefers-reduced-motion: reduce) { .pulse { animation: none; } }
  .timer-big { font-size: 52px; line-height: 1; letter-spacing: -.02em; }
  .btn-start { display: flex; align-items: center; gap: 8px; padding: 11px 20px; border-radius: 10px; border: none; font-weight: 600; font-size: 14px; cursor: pointer; background: var(--amber); color: #1C1F24; }
  .btn-stop { background: var(--red); color: #fff; }

  .pill-select { appearance: none; -webkit-appearance: none; max-width: 100%; font-size: 14px; color: var(--ink); background-color: var(--card); border: 1px solid var(--line2); border-radius: 10px; padding: 9px 32px 9px 12px; cursor: pointer; background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: calc(100% - 17px) 52%, calc(100% - 12px) 52%; background-size: 5px 5px; background-repeat: no-repeat; }

  .sec { display: flex; justify-content: space-between; align-items: baseline; margin: 24px 0 12px; }
  .sec:first-child { margin-top: 0; }
  .sec h2 { font-size: 18px; font-weight: 700; margin: 0; }
  .sec span { font-size: 13px; color: var(--muted); }
  .list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 8px; }
  .empty { border: 1px dashed var(--line2); border-radius: 14px; padding: 30px 16px; text-align: center; color: var(--muted); font-size: 14px; background: var(--card); }

  .entry { display: flex; align-items: center; gap: 12px; padding: 12px 14px; cursor: pointer; }
  .thumbs { display: flex; flex-shrink: 0; padding-left: 12px; }
  .thumbs img, .thumbs .more { width: 60px; height: 60px; border-radius: 12px; object-fit: cover; border: 2px solid var(--card); margin-left: -12px; flex-shrink: 0; }
  .thumbs .more { background: var(--soft); display: flex; align-items: center; justify-content: center; font-size: 12px; color: var(--muted); }
  .entry-main { flex: 1; min-width: 0; }
  .entry-name { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .entry-right { text-align: right; flex-shrink: 0; }
  .entry-dur { font-size: 15px; font-weight: 600; }
  .qty { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .tag { display: inline-block; font-size: 11px; padding: 2px 7px; border-radius: 6px; margin-top: 4px; font-weight: 500; }

  .photo-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 8px; }
  .pg { margin: 0; background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; cursor: pointer; }
  .pg img { width: 100%; aspect-ratio: 1; object-fit: cover; display: block; }
  .pg figcaption { padding: 8px 10px 10px; font-size: 13px; line-height: 1.35; }
  .pg .when { font-size: 11px; color: var(--muted); margin-top: 4px; }

  .toolbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; gap: 10px; }
  .toolbar .label { font-size: 13px; color: var(--muted); }
  .add-row { width: 100%; display: flex; align-items: center; gap: 10px; padding: 14px 16px; border: 1px dashed var(--line2); background: transparent; border-radius: 14px; color: var(--ink); font-size: 15px; font-weight: 500; cursor: pointer; margin-bottom: 14px; }
  .new-row { display: flex; gap: 8px; padding: 10px; margin-bottom: 14px; align-items: center; flex-wrap: wrap; }
  .text-input { flex: 1; min-width: 140px; font-size: 16px; padding: 10px 12px; border: 1px solid var(--line2); border-radius: 10px; background: #fff; color: var(--ink); outline: none; }
  .text-input:focus { border-color: var(--amber); }
  .btn-ok { background: var(--green); color: #fff; border: none; padding: 10px 14px; border-radius: 10px; font-weight: 600; cursor: pointer; font-size: 14px; }
  .btn-ghost { background: none; border: none; color: var(--red2); padding: 10px; cursor: pointer; font-weight: 500; font-size: 14px; }
  .proj { display: flex; align-items: center; gap: 14px; padding: 14px 16px; cursor: pointer; }
  .proj-icon { width: 56px; height: 56px; border-radius: 14px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .proj-icon.big { width: 64px; height: 64px; }
  .proj-main { flex: 1; min-width: 0; }
  .proj-name { font-size: 16px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .proj-sub { font-size: 13px; color: var(--muted); margin-top: 3px; }
  .chev { color: var(--muted); flex-shrink: 0; display: flex; }
  .back { background: none; border: none; color: var(--muted); font-size: 14px; padding: 4px 0 12px; cursor: pointer; display: flex; align-items: center; gap: 4px; }
  .detail-head { display: flex; align-items: center; gap: 14px; margin-bottom: 6px; }
  .detail-head h1 { font-size: 26px; margin: 0; }
  .detail-head .sub { margin: 4px 0 0; }


  .searchrow { display: flex; align-items: center; gap: 10px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 0 14px; height: 48px; margin-bottom: 14px; }
  .searchrow svg { color: var(--muted); flex-shrink: 0; }
  .searchrow input { flex: 1; height: 100%; border: none; outline: none; background: transparent; font-size: 16px; color: var(--ink); }
  .proj, .proj * { -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
  .ctrlbar { position: fixed; left: 0; right: 0; bottom: calc(86px + env(safe-area-inset-bottom, 0px)); padding: 0 20px; z-index: 14; }
  .ctl-row { display: flex; gap: 10px; max-width: 560px; margin: 0 auto; }
  .ctl { flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px; border: none; border-radius: 14px; padding: 15px; font-size: 16px; font-weight: 600; cursor: pointer; color: #fff; box-shadow: 0 4px 14px rgba(0,0,0,.12); }
  .ctl.start { background: var(--green); }
  .ctl.pause { background: #E8833A; }
  .ctl.resume { background: var(--green); }
  .ctl.stop { background: #E10600; }
  .bottombar { position: fixed; left: 0; right: 0; bottom: 0; background: var(--card); border-top: 1px solid var(--line); display: flex; justify-content: space-around; padding: 8px 16px calc(8px + env(safe-area-inset-bottom, 0px)); z-index: 16; }
  .nav-item { background: none; border: none; display: flex; flex-direction: column; align-items: center; gap: 3px; color: var(--muted); font-size: 12px; cursor: pointer; min-width: 72px; padding: 4px; }
  .nav-item.on { color: var(--ink); font-weight: 600; }
  .nav-ico { width: 52px; height: 32px; border-radius: 10px; display: flex; align-items: center; justify-content: center; }
  .nav-item.on .nav-ico { background: var(--soft); }
  .nav-item.play-item .play-ico { background: var(--amber); color: #1C1F24; width: 44px; height: 32px; }
  .nav-item.play-item.on .play-ico { background: var(--red); color: #fff; }

  .overlay, .sheet-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.35); opacity: 0; pointer-events: none; transition: opacity .2s; }
  .overlay { z-index: 40; }
  .sheet-overlay { z-index: 60; }
  .overlay.open, .sheet-overlay.open { opacity: 1; pointer-events: auto; }
  .drawer { position: fixed; top: 0; bottom: 0; left: 0; width: 290px; max-width: 82%; background: var(--card); transform: translateX(-102%); transition: transform .25s ease; z-index: 41; padding: calc(20px + env(safe-area-inset-top, 0px)) 16px 20px; display: flex; flex-direction: column; box-shadow: 4px 0 24px rgba(0,0,0,.12); }
  .drawer.open { transform: translateX(0); }
  .drawer-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; padding: 0 4px; }
  .drawer-head b { font-size: 16px; }
  .drawer-item { width: 100%; text-align: left; background: none; border: none; padding: 14px 12px; border-radius: 12px; font-size: 16px; font-weight: 500; color: var(--ink); cursor: pointer; display: flex; align-items: center; gap: 12px; }
  .drawer-item:hover { background: var(--soft); }
  .drawer-foot { margin-top: auto; font-size: 12px; color: var(--muted); padding: 0 4px; }
  .close-x { background: none; border: none; font-size: 26px; line-height: 1; color: var(--muted); cursor: pointer; padding: 2px 6px; }

  .sheet { position: fixed; left: 0; right: 0; bottom: 0; background: var(--card); border-radius: 18px 18px 0 0; padding: 10px 16px calc(16px + env(safe-area-inset-bottom, 0px)); transform: translateY(105%); transition: transform .25s ease; z-index: 61; box-shadow: 0 -8px 30px rgba(0,0,0,.12); }
  .sheet.open { transform: translateY(0); }
  .grab { width: 40px; height: 5px; border-radius: 3px; background: var(--line2); margin: 0 auto 12px; }
  .sheet-title { font-size: 14px; font-weight: 600; color: var(--muted); text-align: center; margin-bottom: 12px; }
  .sheet-btn { width: 100%; padding: 14px; border: none; background: var(--soft); border-radius: 12px; font-size: 16px; color: var(--ink); margin-bottom: 8px; cursor: pointer; text-align: center; }
  .sheet-btn.on { background: var(--ink); color: #fff; }
  .text-input.full { display: block; width: 100%; min-width: 0; margin-bottom: 14px; }
  .sheet-row { display: flex; gap: 8px; }
  .sheet-btn.half { flex: 1; margin-bottom: 0; }
  .sheet-btn.ok { background: var(--green); color: #fff; }
  .swatches { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin: 4px 0 16px; }
  .swatch { width: 44px; height: 44px; border-radius: 50%; border: 3px solid transparent; padding: 0; cursor: pointer; }
  .swatch.sel { border-color: var(--ink); }
  .badge { display: inline-block; font-size: 11px; color: var(--muted); border: 1px solid var(--line2); border-radius: 6px; padding: 0 6px; margin-left: 6px; }
  .time-bar { width: 100%; max-width: 560px; margin: 0 auto 10px; border: 1.5px solid #000; border-radius: 12px; padding: 14px 16px; background: #fff; text-align: center; font-family: inherit; font-size: 17px; font-weight: 600; line-height: 1.2; color: var(--ink); font-variant-numeric: tabular-nums; }
  .kv-card { padding: 4px 16px; margin-bottom: 18px; }
  .kv { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); font-size: 15px; }
  .kv:last-child { border-bottom: none; }
  .kv span { color: var(--muted); flex-shrink: 0; }
  .kv b { font-weight: 600; text-align: right; min-width: 0; overflow-wrap: anywhere; }

    { view: "calendar", label: "Calc", icon: '<svg width="24" height="24" viewBox="0 0 24 24"><rect x="5" y="2.5" width="14" height="19" rx="2.6" fill="currentColor"/><rect x="7.5" y="4.8" width="9" height="4" rx="1" fill="#FFFFFF"/><circle cx="8.6" cy="12.2" r="1.1" fill="#FFFFFF"/><circle cx="12" cy="12.2" r="1.1" fill="#FFFFFF"/><circle cx="15.4" cy="12.2" r="1.1" fill="#FFFFFF"/><circle cx="8.6" cy="15.2" r="1.1" fill="#FFFFFF"/><circle cx="12" cy="15.2" r="1.1" fill="#FFFFFF"/><circle cx="15.4" cy="15.2" r="1.1" fill="#FFFFFF"/><circle cx="8.6" cy="18.2" r="1.1" fill="#FFFFFF"/><circle cx="12" cy="18.2" r="1.1" fill="#FFFFFF"/><circle cx="15.4" cy="18.2" r="1.1" fill="#FFFFFF"/></svg>' },
    { view: "timer", label: "Track", icon: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="13" r="8"/><line x1="12" y1="13" x2="12" y2="9"/><line x1="10" y1="3" x2="14" y2="3"/><line x1="12" y1="5" x2="12" y2="3"/></svg>' }
  ];

  function $(id) { return document.getElementById(id); }
  function pad(n) { return String(n).padStart(2, "0"); }
  function hms(t) {
    var s = Math.max(0, Math.floor(t));
    return pad(Math.floor(s / 3600)) + ":" + pad(Math.floor((s % 3600) / 60)) + ":" + pad(s % 60);
  }
  function genId() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
  function esc(s) {
    return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }
  function hashIdx(name) {
    var h = 0, n = name || "";
    for (var i = 0; i < n.length; i++) h = (h * 31 + n.charCodeAt(i)) >>> 0;
    return h % PAL.length;
  }
  function colorFor(name) {
    var m = PMETA[name];
    if (m && m.ci != null) return PAL[m.ci];
    return PAL[hashIdx(name)];
  }
  function groupColor(g) {
    return (g.ci != null) ? PAL[g.ci] : colorFor(g.project);
  }
  function fmtWhen(ms) {
    var d = new Date(ms);
    return pad(d.getDate()) + "." + pad(d.getMonth() + 1) + "." + d.getFullYear() + " " + pad(d.getHours()) + ":" + pad(d.getMinutes());
  }
  function countLabel(n, one, many) { return n + (n === 1 ? " " + one : " " + many); }
  function load(k, f) { try { var r = localStorage.getItem(k); return r ? JSON.parse(r) : f; } catch (e) { return f; } }
  function save(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { console.error(e); } }
  function del(k) { try { localStorage.removeItem(k); } catch (e) {} }

  function readFiles(list) {
    return Promise.all(Array.prototype.map.call(list, function (f) {
      return new Promise(function (res, rej) {
        var r = new FileReader();
        r.onload = function () { res(r.result); };
        r.onerror = rej;
        r.readAsDataURL(f);
      });
    }));
  }
  function thumb(url, max, q) {
    max = max || 140; q = q || 0.7;
    return new Promise(function (res) {
      var img = new Image();
      img.onload = function () {
        try {
          var sc = Math.min(1, max / Math.max(img.width, img.height));
          var c = document.createElement("canvas");
          c.width = Math.max(1, Math.round(img.width * sc));
          c.height = Math.max(1, Math.round(img.height * sc));
          c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
          res(c.toDataURL("image/jpeg", q));
        } catch (e) { res(url); }
      };
      img.onerror = function () { res(url); };
      img.src = url;
    });
  }
  // Bilder als {s: Originalbild, d: Beschreibung}; ältere Einträge (nur Strings) werden angepasst
  function normImgs(arr) {
    return (arr || []).map(function (x) {
      return typeof x === "string" ? { s: x, d: "" } : { s: x.s, d: x.d || "" };
    });
  }
  // Fotos eines Eintrags für die Anzeige: {t: Vorschaubild, d: Beschreibung}
  function photosOf(e) {
    if (e.photos) return e.photos;
    return (e.thumbs || []).map(function (t) { return { t: t, d: "" }; });
  }

  // ---------- state ----------
  var st = {
    view: "timer",
    detail: null,
    group: null,
    showNew: false,
    showNewGroup: false,
    query: "",
    sort: load(K_SORT, "az"),
    projects: load(K_PRJ, []),
    groups: load(K_GRP, []),   // [{id, project, name, view?: "list"|"photos", ci?: Farbindex}]
    entries: load(K_ENT, []),  // Eintrag: groupId, qty, photos
    running: load(K_RUN, null),
    startPrj: "",
    modal: null,
    imgs: [],
    modalNew: false,
    sheetGroup: null,
    searchOpen: false,
    renameTarget: null,
    draft: null,
    settingsPanel: null,
    searchOpen: false,
    entryId: null,
    entryView: null,
    keywords: (load(K_KW, null) || [{ word: "bohren", process: "Bohren", params: [{ label: "Bohrdurchmesser", unit: "mm", type: "range", min: 1, max: 30, step: 0.5 }] }]).map(normKw),
    kwDraft: null,
    kwEditId: null,
    tmpParams: null
  };
  var tickId = null;

  // ---------- data helpers ----------
  function addProject(n) {
    n = (n || "").trim();
    if (n && st.projects.indexOf(n) < 0) { st.projects.push(n); save(K_PRJ, st.projects); }
  }
  function statsOf(list) {
    var total = 0, last = 0;
    list.forEach(function (e) {
      total += e.duration;
      var t = new Date(e.start).getTime();
      if (t > last) last = t;
    });
    return { total: total, count: list.length, last: last, entries: list };
  }
  function projectStats(name) {
    var s = statsOf(st.entries.filter(function (e) { return e.project === name; }));
    s.name = name;
    return s;
  }
  function groupsOf(project) {
    return st.groups.filter(function (g) { return g.project === project; });
  }
  function groupStats(g) {
    var s = statsOf(st.entries.filter(function (e) { return e.groupId === g.id; }));
    s.group = g;
    return s;
  }
  function sortedProjects() {
    var q = st.query.trim().toLowerCase();
    var list = st.projects.map(projectStats);
    if (q) {
      list = list.filter(function (p) {
        return p.name.toLowerCase().indexOf(q) >= 0 ||
          p.entries.some(function (e) { return (e.name || "").toLowerCase().indexOf(q) >= 0; });
      });
    }
    function pinOf(p) { return (PMETA[p.name] && PMETA[p.name].pin) ? 1 : 0; }
    function favOf(p) { return (PMETA[p.name] && PMETA[p.name].fav) ? 1 : 0; }
    var az = function (a, b) { return a.name.localeCompare(b.name, "de"); };
    var cmp = {
      az: az,
      za: function (a, b) { return b.name.localeCompare(a.name, "de"); },
      new: function (a, b) { return b.last - a.last; },
      old: function (a, b) { return a.last - b.last; },
      most: function (a, b) { return b.total - a.total; },
      least: function (a, b) { return a.total - b.total; },
      favs: function (a, b) { return (favOf(b) - favOf(a)) || az(a, b); },
      pins: function (a, b) { return (pinOf(b) - pinOf(a)) || az(a, b); }
    }[st.sort] || az;
    list.sort(cmp);
    // angepinnte Projekte stehen immer oben
    return list.filter(function (p) { return pinOf(p); })
      .concat(list.filter(function (p) { return !pinOf(p); }));
  }
  function byNewest(a, b) { return new Date(b.start) - new Date(a.start); }
  function byOldest(a, b) { return new Date(a.start) - new Date(b.start); }

  // ---------- views ----------
  function entryCard(e) {
    var c = colorFor(e.project), th = "", ph = photosOf(e);
    if (e.cover) {
      th = '<div class="thumbs"><img src="' + e.cover + '" alt=""></div>';
    } else if (ph.length) {
      th = '<div class="thumbs">' + ph.slice(0, 3).map(function (p) { return '<img src="' + p.t + '" alt="">'; }).join("");
      if (e.imageCount > 3) th += '<div class="more">+' + (e.imageCount - 3) + "</div>";
      th += "</div>";
    }
    var qtyTxt = e.qty ? '<div class="qty">' + e.qty + (e.qty === 1 ? " Stück" : " Stk.") + "</div>" : "";
    return '<button class="card entry" data-act="open-entry" data-id="' + esc(e.id) + '">' + th +
      '<div class="entry-main"><div class="entry-name">' + esc(e.name) + "</div></div>" +
      '<div class="entry-right"><div class="entry-dur mono">' + hms(e.duration) + "</div>" + qtyTxt +
      '<span class="tag" style="background:' + c.bg + ";color:" + c.dot + '">' + esc(e.project) + "</span></div></button>";
  }
  function entryList(list) {
    if (!list.length) return '<div class="empty">Noch keine Zeit erfasst. Starte den Timer, um deinen ersten Eintrag anzulegen.</div>';
    return '<div class="list">' + list.map(entryCard).join("") + "</div>";
  }
  function photosHtml(entries) {
    var items = [];
    entries.slice().sort(byOldest).forEach(function (e) {
      photosOf(e).forEach(function (p) { items.push({ p: p, e: e }); });
    });
    if (!items.length) return '<div class="empty">Noch keine Bilder in dieser Baugruppe.</div>';
    return '<div class="photo-grid">' + items.map(function (x) {
      return '<figure class="pg" data-act="open-entry" data-id="' + esc(x.e.id) + '"><img src="' + x.p.t + '" alt="">' +
        "<figcaption>" + esc(x.p.d || x.e.name) + '<div class="when mono">' + fmtWhen(new Date(x.e.start).getTime()) + "</div></figcaption></figure>";
    }).join("") + "</div>";
  }

  function timerHtml() {
    var head = '<h1>Zeiterfassung</h1><p class="sub">Arbeitszeit mit Bildern erfassen</p>';
    var elapsed = st.running ? elapsedOf(st.running) : (st.draft ? (st.draft.dur || 0) : 0);
    var clock = '<div class="time-bar top-time" id="timerDisplay">' + hms(elapsed) + "</div>";
    if (!st.draft) return head;
    return head + '<div class="card draft-host" id="draftHost"></div>';
  }

  function projCard(p) {
    var c = colorFor(p.name), m = PMETA[p.name] || {};
    var when = p.last ? "Zuletzt: " + fmtWhen(p.last) : "Noch keine Zeit erfasst";
    var badges = (m.pin ? '<span class="badge">Angepinnt</span>' : "") + (m.fav ? '<span class="badge">Favorit</span>' : "");
    return '<button class="card proj" data-act="open-project" data-id="' + esc(p.name) + '">' +
      iconBox("p", p.name, c.bg, c.dot, 26) +
      '<div class="proj-main"><div class="proj-name">' + esc(p.name) + '</div><div class="proj-sub mono">' +
      hms(p.total) + " · " + countLabel(p.count, "Eintrag", "Einträge") + "</div>" +
      '<div class="proj-sub">' + when + badges + "</div></div>" +
      '<span class="chev">' + ICO_R + "</span></button>";
  }

  function projRows() {
    var list = sortedProjects();
    return list.length
      ? list.map(projCard).join("")
      : '<div class="empty">' + (st.query ? "Keine Treffer für „" + esc(st.query) + "“." : "Noch keine Projekte. Lege oben ein neues an.") + "</div>";
  }

  function projectsHtml() {
    var opts = Object.keys(SORTS).map(function (k) {
      return '<option value="' + k + '"' + (st.sort === k ? " selected" : "") + ">" + SORTS[k] + "</option>";
    }).join("");
    var search = "";
    var add = st.showNew
      ? '<div class="card new-row"><input id="npIn" class="text-input" placeholder="Projektname" autocomplete="off">' +
        '<button class="btn-ok" data-act="np-ok">Anlegen</button><button class="btn-ghost" data-act="np-cancel">Abbrechen</button></div>'
      : '<button class="add-row" data-act="new-project"><span style="font-size:20px;line-height:1">+</span> Neues Projekt</button>';
    return "<h1>Projekte</h1><p class=\"sub\">Deine Projekte auf einen Blick</p>" + search +
      (pref("sort") ? '<div class="toolbar"><span class="label">Sortieren nach</span><select id="sortSel" class="pill-select">' + opts + "</select></div>" : "") +
      add + '<div class="list" id="projList">' + projRows() + "</div>";

  function groupCard(gs) {
    var c = groupColor(gs.group);
    return '<button class="card proj" data-act="open-group" data-id="' + esc(gs.group.id) + '">' +
      iconBox("g", gs.group.id, c.bg, c.dot, 26) +
      '<div class="proj-main"><div class="proj-name">' + esc(gs.group.name) + '</div><div class="proj-sub mono">' +
      hms(gs.total) + " · " + countLabel(gs.count, "Arbeitsschritt", "Arbeitsschritte") + "</div></div>" +
      '<span class="chev">' + ICO_R + "</span></button>";
  }

  function newGroupRow() {
    return '<div class="card new-row"><input id="ngIn" class="text-input" placeholder="Name der Baugruppe" autocomplete="off">' +
      '<button class="btn-ok" data-act="ng-ok">Anlegen</button><button class="btn-ghost" data-act="ng-cancel">Abbrechen</button></div>';
  }

  function folderSum(list) { return list.reduce(function (a, e) { return a + e.duration; }, 0); }
  function noneCard(project, list) {
    var c = colorFor(project);
    return '<button class="card proj" data-act="open-group" data-id="' + NONE + ":" + esc(project) + '">' +
      '<div class="proj-icon" style="background:' + c.bg + '">' + folderIco(c.dot, 26) + "</div>" +
      '<div class="proj-main"><div class="proj-name">Ohne Baugruppe</div><div class="proj-sub mono">' +
      hms(folderSum(list)) + " · " + countLabel(list.length, "Arbeitsschritt", "Arbeitsschritte") + "</div></div>" +
      '<span class="chev">' + ICO_R + "</span></button>";
  }
  function projectDetailHtml(name) {
    var p = projectStats(name), c = colorFor(name);
    var groups = groupsOf(name).map(groupStats);
    var noneEntries = p.entries.filter(function (e) { return !e.groupId; });
    var addRow = st.showNewGroup
      ? newGroupRow()
      : '<button class="add-row" data-act="new-group"><span style="font-size:20px;line-height:1">+</span> Neue Baugruppe</button>';
    var folders = groups.map(groupCard).join("");
    if (noneEntries.length) folders += noneCard(name, noneEntries);
    var empty = (!folders && !st.showNewGroup) ? '<div class="empty">Noch keine Baugruppen. Lege oben eine Baugruppe an.</div>' : "";
    return '<button class="back" data-act="back">' + ICO_L + " Projekte</button>" +
      '<div class="detail-head">' + iconBox("p", name, c.bg, c.dot, 30, true) +
      "<div><h1>" + esc(name) + '</h1><p class="sub mono">Gesamt ' + hms(p.total) + " · " + countLabel(p.count, "Arbeitsschritt", "Arbeitsschritte") + "</p></div></div>" +
      '<div class="sec"><h2>Baugruppen</h2><span>' + (groups.length + (noneEntries.length ? 1 : 0)) + "</span></div>" +
      addRow + (folders ? '<div class="list">' + folders + "</div>" : "") + empty;
  }

  function fileList(list) {
    if (!list.length) return '<div class="empty">Keine Arbeitsschritte in diesem Ordner.</div>';
    var doc = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><polyline points="14 3 14 8 19 8"/></svg>';
    return '<div class="file-list">' + list.map(function (e) {
      var c = colorFor(e.project);
      var sub = [hms(e.duration), e.qty ? e.qty + " Stk." : ""].filter(Boolean).join(" · ");
      var ico = e.cover ? '<img class="file-thumb" src="' + e.cover + '" alt="">'
        : '<span class="file-ico" style="color:' + c.dot + '">' + doc + "</span>";
      return '<button class="card file-row" data-act="open-entry" data-id="' + esc(e.id) + '">' + ico +
        '<div class="file-main"><div class="file-name">' + esc(e.name) + '</div><div class="file-sub mono">' + esc(sub) + "</div></div>" +
        '<span class="chev">' + ICO_R + "</span></button>";
    }).join("") + "</div>";
  }
  function groupDetailHtml(id) {
    var g = null, project, title, entries;
    if (id.indexOf(NONE + ":") === 0) {
      project = id.slice(NONE.length + 1);
      if (st.projects.indexOf(project) < 0) { st.group = null; return projectDetailHtml(st.detail); }
      entries = st.entries.filter(function (e) { return e.project === project && !e.groupId; });
      title = "Ohne Baugruppe";
    } else {
      g = st.groups.filter(function (x) { return x.id === id; })[0];
      if (!g) { st.group = null; return projectDetailHtml(st.detail); }
      project = g.project;
      title = g.name;
      entries = st.entries.filter(function (e) { return e.groupId === g.id; });
    }
    var sum = statsOf(entries), c = g ? groupColor(g) : colorFor(project);
    var icon = g ? iconBox("g", g.id, c.bg, c.dot, 30, true)
      : '<div class="proj-icon big" style="background:' + c.bg + '">' + folderIco(c.dot, 30) + "</div>";
    var head = '<button class="back" data-act="back">' + ICO_L + " " + esc(project) + "</button>" +
      '<div class="detail-head">' + icon +
      "<div><h1" + (g ? ' class="gh"' : "") + ">" + esc(title) + '</h1><p class="sub mono">Gesamt ' + hms(sum.total) + " · " +
      countLabel(sum.count, "Arbeitsschritt", "Arbeitsschritte") + "</p></div></div>";
    var hint = g ? '<p class="hint">Überschrift lange drücken für Einstellungen</p>' : "";
    var body = (g && g.view === "photos") ? photosHtml(entries)
      : '<div class="sec"><h2>Arbeitsschritte</h2><span>' + entries.length + "</span></div>" + fileList(entries.slice().sort(byNewest));
    return head + hint + body;
  }

  function renderMain() {
    ensureDraft();
    var html;
    if (st.searchOpen && st.query.trim()) html = searchHtml();
    else if (st.entryId && st.view === st.entryView) html = entryHtml(st.entryId);
    else if (st.view === "params") html = paramsHtml();
    else if (st.view === "settings") html = settingsHtml();
    else if (st.view === "calendar") html = "";
    else if (st.view === "timer") html = timerHtml();
    else if (st.detail && st.group) html = groupDetailHtml(st.group);
    else if (st.detail) html = projectDetailHtml(st.detail);
    else html = projectsHtml();
    parkDraft();
    $("main").innerHTML = html;
    initEntryWheel();
    if (inlineActive()) {
      var host = $("draftHost");
      if (host) {
        host.appendChild(M_BODY);
        host.appendChild(M_FOOT);
        M_FOOT.style.display = "none";
        applyFieldPrefs();
        $("saveBtn").disabled = !!st.running || !(st.draft.dur > 0);
        var dd = host.querySelector('[data-act="draft-delete"]');
        if (dd) dd.disabled = !!st.running;
      }
    }
    // Track ist auf der Zeitseite ausgeblendet, dort rutschen die Start-Knöpfe an seine Stelle
    $("bottombar").innerHTML = '<div class="pill">' + NAV.filter(function (n) {
      return !(n.view === "timer" && st.view === "timer");
    }).map(function (n) {
      var on = st.view === n.view;
      return '<button class="nav-item' + (on ? " on" : "") + '" data-act="nav" data-view="' + n.view + '"><span class="nav-ico">' + n.icon + "</span><span>" + n.label + "</span></button>";
    }).join("") + '</div><div class="pill actions" id="actions"></div>';
    renderCtrl();
    syncTopbar();
    if (st.showNew) { var i = $("npIn"); if (i) i.focus(); }
    if (st.showNewGroup) { var g = $("ngIn"); if (g) g.focus(); }
  }

  // ---------- Neue Baugruppe aus dem Fenster „Zeit erfassen“ ----------
  function openNewGroupSheet() {
    $("sheet").innerHTML =
      '<div class="grab"></div>' +
      '<div class="sheet-title">Neue Baugruppe</div>' +
      '<input type="text" id="ngmIn" class="text-input full" placeholder="Name der Baugruppe" autocomplete="off">' +
      '<div class="sheet-row">' +
        '<button class="sheet-btn half" data-act="ngm-cancel">Abbrechen</button>' +
        '<button class="sheet-btn half ok" data-act="ngm-ok">Bestätigen</button>' +
      "</div>";
    $("sheetOverlay").classList.add("open");
    $("sheet").classList.add("open");
    var inp = $("ngmIn");
    if (inp) inp.focus();
  }

  // ---------- Titelbild (Datei, Projekt, Baugruppe) ----------
  function coverFullKey(kind, id) { return kind === "e" ? K_COV + id : K_COV + kind + ":" + id; }
  function coverGet(kind, id) {
    if (kind === "p") return (PMETA[id] && PMETA[id].cover) || null;
    if (kind === "g") { var g = st.groups.filter(function (x) { return x.id === id; })[0]; return (g && g.cover) || null; }
    var e = st.entries.filter(function (x) { return x.id === id; })[0];
    return (e && e.cover) || null;
  }
  function coverSet(kind, id, th, full) {
    save(coverFullKey(kind, id), full);
    if (kind === "p") { PMETA[id] = Object.assign({}, PMETA[id] || {}, { cover: th }); save(K_PMETA, PMETA); }
    else if (kind === "g") { st.groups = st.groups.map(function (g) { return g.id === id ? Object.assign({}, g, { cover: th }) : g; }); save(K_GRP, st.groups); }
    else { st.entries = st.entries.map(function (e) { return e.id === id ? Object.assign({}, e, { cover: th }) : e; }); save(K_ENT, st.entries); }
  }
  function coverRemove(kind, id) {
    del(coverFullKey(kind, id));
    if (kind === "p") { if (PMETA[id]) { delete PMETA[id].cover; save(K_PMETA, PMETA); } }
    else if (kind === "g") {
      st.groups = st.groups.map(function (g) { if (g.id !== id) return g; var c = Object.assign({}, g); delete c.cover; return c; });
      save(K_GRP, st.groups);
    } else {
      st.entries = st.entries.map(function (e) { if (e.id !== id) return e; var c = Object.assign({}, e); delete c.cover; return c; });

  function toggleFlag(name, flag) {

  function duplicateProject(name) {
    var n = name + " (Kopie)", k = 2;
    while (st.projects.indexOf(n) >= 0) { n = name + " (Kopie " + (k++) + ")"; }
    st.projects.push(n);
    var gmap = {};
    st.groups.filter(function (g) { return g.project === name; }).forEach(function (g) {
      var ng = Object.assign({}, g, { id: genId(), project: n });
      gmap[g.id] = ng.id;
      st.groups.push(ng);
    });
    st.entries.filter(function (e) { return e.project === name; }).forEach(function (e) {
      var ne = Object.assign({}, e, { id: genId(), project: n, groupId: e.groupId ? (gmap[e.groupId] || null) : null });
      var imgs = load(K_IMG + e.id, null);
      if (imgs) save(K_IMG + ne.id, imgs);
      st.entries.push(ne);
    });
    st.entries.sort(byOldest);
    if (PMETA[name]) PMETA[n] = Object.assign({}, PMETA[name], { pin: false });
    save(K_PRJ, st.projects);
    save(K_GRP, st.groups);
    save(K_ENT, st.entries);
    save(K_PMETA, PMETA);
  }

  function renameProject(oldName, v) {
    if (!v || v === oldName) return;
    if (st.projects.indexOf(v) >= 0) { window.alert("Ein Projekt mit diesem Namen gibt es schon."); return; }
    st.projects = st.projects.map(function (p) { return p === oldName ? v : p; });
    st.entries = st.entries.map(function (e) { return e.project === oldName ? Object.assign({}, e, { project: v }) : e; });
    st.groups = st.groups.map(function (g) { return g.project === oldName ? Object.assign({}, g, { project: v }) : g; });
    if (st.running && st.running.project === oldName) { st.running.project = v; save(K_RUN, st.running); }
    if (st.startPrj === oldName) st.startPrj = v;
    if (st.detail === oldName) st.detail = v;
    if (PMETA[oldName]) { PMETA[v] = PMETA[oldName]; delete PMETA[oldName]; save(K_PMETA, PMETA); }
    save(K_PRJ, st.projects);
    save(K_ENT, st.entries);
    save(K_GRP, st.groups);
  }
  function deleteProject(name) {
    st.entries.forEach(function (e) { if (e.project === name) del(K_IMG + e.id); });
    st.entries = st.entries.filter(function (e) { return e.project !== name; });
    st.groups = st.groups.filter(function (g) { return g.project !== name; });
    st.projects = st.projects.filter(function (p) { return p !== name; });
    delete PMETA[name];
    save(K_PMETA, PMETA);
    if (st.startPrj === name) st.startPrj = "";
    if (st.detail === name) { st.detail = null; st.group = null; }
    save(K_PRJ, st.projects);
    save(K_ENT, st.entries);
    save(K_GRP, st.groups);
  }

  // ---------- timer ----------
  function elapsedOf(r) {
    var end = r.pauseStart ? new Date(r.pauseStart).getTime() : Date.now();
    return Math.max(0, (end - new Date(r.startIso).getTime() - (r.pausedMs || 0)) / 1000);
  }
  function startTick() {
    if (tickId) return;
    tickId = setInterval(function () {
      var d = $("timerDisplay");
      if (d && st.running) d.textContent = hms(elapsedOf(st.running));
      var di = $("durationInput");
      if (di && st.running && st.modal && st.modal.isNew) di.value = hms(elapsedOf(st.running));
    }, 1000);
  }
  function stopTick() { if (tickId) clearInterval(tickId); tickId = null; }

  function startTimer() {
    st.running = { project: (st.draft && st.draft.project) || st.startPrj || "", startIso: new Date().toISOString(), pausedMs: 0, pauseStart: null };
    save(K_RUN, st.running);
    if (st.draft) st.draft.dur = 0;
    var di0 = $("durationInput");
    if (di0) di0.value = "00:00:00";
    st.view = "timer";
    st.detail = null;
    st.group = null;
    startTick();
    renderMain();
  }
  function togglePause() {
    var r = st.running;
    if (!r) return;
    if (r.pauseStart) {
      r.pausedMs = (r.pausedMs || 0) + (Date.now() - new Date(r.pauseStart).getTime());
      r.pauseStart = null;
    } else {
      r.pauseStart = new Date().toISOString();
    }
    save(K_RUN, r);
    renderMain();
  }
  function stopTimer() {
    if (!st.running) return;
    var r = st.running;
    var d = (st.draft && st.draft.isNew) ? st.draft : newDraft();
    d.project = d.project || r.project || "";
    d.start = r.startIso;
    d.end = new Date().toISOString();
    d.dur = elapsedOf(r);
    stopTick();
    st.running = null;
    del(K_RUN);
    st.draft = d;
    st.modal = d;
    var diS = $("durationInput");
    if (diS) diS.value = hms(d.dur);
    renderMain();
  }
  function renderCtrl() {
    var bar = $("ctrlbar"), act = $("actions");
    if (st.view !== "timer") { bar.innerHTML = ""; if (act) act.innerHTML = ""; return; }
    var r = st.running;
    var elapsed = r ? elapsedOf(r) : (st.draft ? (st.draft.dur || 0) : 0);
    bar.innerHTML = "";
    if (!r && st.draft && st.draft.start && st.draft.dur > 0) {
      act.innerHTML =
        '<button class="ctl del" data-act="draft-delete">Löschen</button>' +
        '<button class="ctl save" data-act="save">Speichern</button>';
    } else if (!r) {
      act.innerHTML = '<button class="ctl start" data-act="start">' + PLAY + " Start</button>";
    } else {
      var paused = !!r.pauseStart;
      act.innerHTML =
        '<button class="ctl ' + (paused ? "resume" : "pause") + '" data-act="pause">' + (paused ? PLAY + " Weiter" : PAUSE + " Pause") + "</button>" +
        '<button class="ctl stop" data-act="stop">' + STOP + " Stop</button>";
    }
  }

  // ---------- Fenster „Zeit erfassen“ ----------
  function fillForm(e, imgs) {
    st.modal = e;
    st.imgs = imgs || [];
    st.modalNew = false;
    $("modalTitle").textContent = e.isNew ? "Zeit erfassen" : "Eintrag bearbeiten";
    $("nameInput").value = e.name || "";
    $("qtyInput").value = e.qty || 1;
    var dur = $("durationInput");
    dur.type = e.isNew ? "text" : "time";
    dur.readOnly = !!e.isNew;
    dur.value = hms(e.isNew ? (e.dur || 0) : (new Date(e.end) - new Date(e.start)) / 1000);
    $("deleteArea").innerHTML = e.isNew
      ? '<button class="del" data-act="draft-delete">Löschen</button>'
      : '<button class="del" data-act="delete" data-id="' + esc(e.id) + '">Löschen</button>';
    M_FOOT.querySelector(".cancel").style.display = e.isNew ? "none" : "";
    $("saveBtn").disabled = false;
    $("saveBtn").textContent = e.isNew ? "Speichern" : "Fertig";
    renderProjField();
    renderGroupField();
    renderImgs();
    setQty(e.qty || 1);
    renderParamArea();
  }
  function openModal(e, imgs) {
    if (e.isNew) {
      st.draft = e;
      fillForm(e, imgs);
      renderMain();
      return;
    }
    parkDraft();
    fillForm(e, imgs);
    $("modalOverlay").classList.add("open");
  }
  function closeModal() {
    $("modalOverlay").classList.remove("open");
    st.modal = null;
    st.imgs = [];
    st.draft = null;
    renderMain();
  }
  function renderProjField() {
    var a = $("projectFieldArea");
    if (st.modalNew) {
      a.innerHTML = '<div class="new-row-m"><input type="text" id="mpIn" class="text-input" placeholder="Neues Projekt" autocomplete="off"><button class="btn-ok" data-act="mp-ok">OK</button></div>';
      var i = $("mpIn");
      if (i) i.focus();
    } else {
      var cur = st.modal.project || "";
      var opts = st.projects.map(function (p) {
        return '<option value="' + esc(p) + '"' + (p === cur ? " selected" : "") + ">" + esc(p) + "</option>";
      }).join("");
      var extra = (cur && st.projects.indexOf(cur) < 0) ? '<option value="' + esc(cur) + '" selected>' + esc(cur) + "</option>" : "";
      a.innerHTML = '<select id="pSel"><option value="" disabled' + (cur ? "" : " selected") + '>Projekt wählen …</option>' + extra + opts + '<option value="__new__">+ Neues Projekt …</option></select>';
    }
  }
  function renderGroupField() {
    var list = groupsOf(st.modal.project || "");
    var opts = '<option value="">Ohne Baugruppe</option>' + list.map(function (g) {
      return '<option value="' + esc(g.id) + '"' + (g.id === st.modal.groupId ? " selected" : "") + ">" + esc(g.name) + "</option>";
    }).join("") + '<option value="__new_g__">+ Neue Baugruppe …</option>';
    $("groupFieldArea").innerHTML = '<select id="gSel">' + opts + "</select>";
  }
  function renderImgs() {
    $("imgGrid").innerHTML = st.imgs.map(function (im, i) {
      return '<div class="img-row"><img src="' + im.s + '" alt="">' +
        '<textarea class="img-desc" data-i="' + i + '" placeholder="Beschreibung zu diesem Bild">' + esc(im.d) + "</textarea>" +
        '<button class="img-rm" data-act="img-remove" data-i="' + i + '" aria-label="Bild entfernen">&times;</button></div>';
    }).join("");
  }
  function openEdit(id) {
    var e = st.entries.filter(function (x) { return x.id === id; })[0];
    if (!e) return;
    openModal({ id: e.id, name: e.name, project: e.project, start: e.start, end: e.end, groupId: e.groupId || null, qty: e.qty || 1, isNew: false },
      normImgs(load(K_IMG + id, [])));
  }
  function saveEntry() {
    var m = st.modal;
    if (!m) return;
    var btn = $("saveBtn");
    btn.disabled = true;
    btn.textContent = "Speichert …";
    var imgs = st.imgs.map(function (im) { return { s: im.s, d: im.d || "" }; });
    var project = (m.project || "").trim() || "Ohne Projekt";
    var name = $("nameInput").value.trim() || "Unbenannter Eintrag";
    var qty = Math.max(1, parseInt($("qtyInput").value, 10) || 1);
    var groupId = (m.groupId && st.groups.some(function (g) { return g.id === m.groupId && g.project === project; })) ? m.groupId : null;
    Promise.all(imgs.map(function (im) { return thumb(im.s); })).then(function (ths) {
      var meta = {
        id: m.id, name: name, project: project, start: m.start, end: m.end,
        duration: (m.dur != null) ? m.dur : (new Date(m.end) - new Date(m.start)) / 1000,
        qty: qty, groupId: groupId, params: Array.isArray(m.params) ? m.params : [],
        imageCount: imgs.length,
        photos: ths.map(function (t, i) { return { t: t, d: imgs[i].d }; })
      };
      addProject(project);
      if (m.isNew) st.entries.push(meta);
      else st.entries = st.entries.map(function (e) { return e.id === meta.id ? meta : e; });
      st.entries.sort(byOldest);
      save(K_ENT, st.entries);
      if (imgs.length) save(K_IMG + m.id, imgs); else del(K_IMG + m.id);
      closeModal();
      renderMain();
    }).catch(function (err) {
      console.error(err);
      btn.disabled = false;
      btn.textContent = (st.modal && st.modal.isNew) ? "Speichern" : "Fertig";
    });
  }
  function delEntry(id) {
    st.entries = st.entries.filter(function (e) { return e.id !== id; });
    save(K_ENT, st.entries);
    del(K_IMG + id);
    closeModal();
    renderMain();
  }

  function setDrawer(open) {
    $("drawer").classList.toggle("open", open);
    $("drawerOverlay").classList.toggle("open", open);
  }

  // ---------- Aktionen (data-act) ----------
  var H = {

    "drawer-close": function () { setDrawer(false); },
    "nav": function (t) {
      st.view = t.getAttribute("data-view");
      st.detail = null; st.group = null; st.showNew = false; st.showNewGroup = false;
      setDrawer(false); renderMain();
    },
    "new-project": function () {
      st.view = "projects"; st.detail = null; st.group = null; st.showNew = true; st.showNewGroup = false;
      setDrawer(false); renderMain();
    },
    "np-cancel": function () { st.showNew = false; renderMain(); },
    "np-ok": function () {
      var i = $("npIn"), v = i ? i.value.trim() : "";
      if (v) { addProject(v); st.startPrj = v; }
      st.showNew = false;
      renderMain();
    },
    "open-project": function (t, id) { st.detail = id; st.group = null; st.showNewGroup = false; renderMain(); },
    "open-group": function (t, id) { st.group = id; st.showNewGroup = false; renderMain(); },
    "back": function () {
      if (st.group) { st.group = null; }
      else { st.detail = null; st.showNewGroup = false; }
      renderMain();
    },
    "new-group": function () { st.showNewGroup = true; renderMain(); },
    "ng-cancel": function () { st.showNewGroup = false; renderMain(); },
    "ng-ok": function () {
      var i = $("ngIn"), v = i ? i.value.trim() : "";
      if (v && st.detail) {
        st.groups.push({ id: genId(), project: st.detail, name: v, view: "list" });
        save(K_GRP, st.groups);
      }
      st.showNewGroup = false;
      renderMain();
    },
    "sheet-close": function () { closeSheet(); if (st.modal) renderGroupField(); },
    "draft-delete": function () { openDraftDelConfirm(); },
    "dd-cancel": function () { closeSheet(); },
    "dd-ok": function () {
      closeSheet();
      st.draft = null;
      st.modal = null;
      st.imgs = [];
      renderMain();
    },
    "settings-open": function () {
      st.view = "settings"; st.settingsPanel = null; st.detail = null; st.group = null;
      st.showNew = false; st.showNewGroup = false;
      setDrawer(false); renderMain();
    },
    "settings-pick": function (t, id) { st.settingsPanel = id; renderMain(); },
    "settings-back": function () {
      if (st.settingsPanel) { st.settingsPanel = null; }
      else { st.view = "timer"; }
      renderMain();
    },
    "pref-toggle": function (t) {
      var key = t.getAttribute("data-key"), panel = t.getAttribute("data-id");
      prefs[key] = !pref(key);
      save(K_PREFS, prefs);
      if (key === "search" && !prefs.search) { st.searchOpen = false; st.query = ""; }
      renderMain();
    },
    "ngm-ok": function () {
      var i = $("ngmIn"), v = i ? i.value.trim() : "";
      if (!v || !st.modal) return;
      var pr = (st.modal.project || "").trim() || "Ohne Projekt";
      var g = { id: genId(), project: pr, name: v, view: "list" };
      st.groups.push(g);
      save(K_GRP, st.groups);
      st.modal.project = pr;
      st.modal.groupId = g.id;
      closeSheet();
      renderProjField();
      renderGroupField();
    },
    "ngm-cancel": function () { closeSheet(); if (st.modal) renderGroupField(); },
    "g-rename": function (t, id) { openRename("group", id); },
    "g-color": function (t, id) {
      var g = st.groups.filter(function (x) { return x.id === id; })[0];
      if (g) { g.ci = ((g.ci || 0) + 1) % PAL.length; save(K_GRP, st.groups); }
      closeSheet(); renderMain();

    else if (pc && !h) { var pname = pc.getAttribute("data-id"); start = function () { openProjSheet(pname); }; }
    else if (gc && !h) { var gid = gc.getAttribute("data-id"); start = function () { openSheet(gid); }; }
    else if (ec && !h && !pc) { var eid = ec.getAttribute("data-id") || ec.getAttribute("data-eid"); start = function () { openCoverSheet("e", eid); }; }
    else if (cl(".detail-head .proj-icon") && !h && st.group) { var gcv = st.group; start = function () { openCoverSheet("g", gcv); }; }
    else if (cl(".detail-head .proj-icon") && !h && st.detail) { var pcv = st.detail; start = function () { openCoverSheet("p", pcv); }; }
    else if (hd && !h && st.group) { start = function () { openSheet(st.group); }; }
    else if (hd && !h && st.detail) { var dname = st.detail; start = function () { openProjSheet(dname); }; }
    if (start) lpTimer = setTimeout(function () { lpFired = true; start(); }, 500);

      if (raf) return;
      raf = requestAnimationFrame(function () {
        raf = null;
        var n = Math.max(0, Math.min(1000, Math.round(w.scrollLeft / 56)));

  // ---------- Wischen: Zeit <-> Projekte ----------
  var sw = null;
  document.addEventListener("touchstart", function (ev) {
    if (ev.touches.length !== 1) { sw = null; return; }
    var t = ev.target;
    if (t.closest && t.closest("input, textarea, select, .qty-wheel, .modal-overlay.open, .sheet.open, .drawer.open, .sheet-overlay.open")) { sw = null; return; }
    sw = { x: ev.touches[0].clientX, y: ev.touches[0].clientY, t: Date.now() };
  }, { passive: true });
  document.addEventListener("touchend", function (ev) {
    if (!sw) return;
    var c = ev.changedTouches[0];
    var dx = c.clientX - sw.x, dy = c.clientY - sw.y, dt = Date.now() - sw.t;
    sw = null;
    if (Math.abs(dx) < 70 || Math.abs(dx) < Math.abs(dy) * 1.5 || dt > 800) return;
    if (dx > 0 && st.view === "timer") {
      st.view = "projects"; st.detail = null; st.group = null; st.showNew = false; st.showNewGroup = false;

    if (!keys.length) return head + '<div class="empty">Noch keine Einträge.</div>';

      var total = list.reduce(function (a, e) { return a + e.duration; }, 0);

  // ---------- Stückzahl-Regler auf der Arbeitsschritt-Seite ----------
  function buildWheel(w, start, onChange) {
    var html = "";
    for (var n = 0; n <= 1000; n++) html += '<div class="qi">' + n + "</div>";
    w.innerHTML = html;
    var cur = -1, raf = null;
    function mark(n) {
      Array.prototype.forEach.call(w.children, function (c, i) { c.classList.toggle("on", i === n); });
    }
    w.addEventListener("scroll", function () {
      if (raf) return;
      raf = requestAnimationFrame(function () {
        raf = null;
        var n = Math.max(0, Math.min(1000, Math.round(w.scrollLeft / 56)));
        if (n !== cur) { cur = n; mark(n); onChange(n); }
      });
    });
    cur = start;
    w.scrollLeft = start * 56;
    mark(start);
  }
  function initEntryWheel() {
    if (!(st.entryId && st.view === st.entryView)) return;
    var w = $("entryWheel");
    var e = st.entries.filter(function (x) { return x.id === st.entryId; })[0];
    if (!w || !e) return;
    var eid = e.id;
    buildWheel(w, e.qty || 1, function (n) {
      st.entries = st.entries.map(function (x) { return x.id === eid ? Object.assign({}, x, { qty: n }) : x; });

  }

      '<div id="kpList" style="display:' + (isList ? "" : "none") + '"><label class="kw-l">Auswahlwerte, durch Komma getrennt</label>' +
        '<input id="kpOpts" class="text-input full" value="' + esc((p.options || []).join(", ")) + '"></div>' +
      '<div class="sheet-row"><button class="sheet-btn half" data-act="kw-back">Abbrechen</button>' +
      '<button class="sheet-btn half ok" data-act="kp-save" data-val="' + idx + '">Übernehmen</button></div>';
  }
  function libMenu() {
    var seen = {}, uniq = [];
    PROC_LIB.forEach(function (pr) {
      pr.params.forEach(function (p) {
        var key = p.label + "|" + p.unit;
        if (!seen[key]) { seen[key] = true; uniq.push(p); }
      });
    });
    st.tmpParams = uniq;
    $("sheet").innerHTML = '<div class="grab"></div><div class="sheet-title">Parameter hinzufügen</div>' +
      uniq.map(function (p, i) {
        return '<button class="sheet-btn" data-act="kw-lib" data-val="' + i + '">' + esc(p.label) + (p.unit ? " (" + esc(p.unit) + ")" : "") +
          '<span class="kw-meta kw-inline">' + esc(paramSummary(p)) + "</span></button>";
      }).join("") +
      '<button class="sheet-btn" data-act="kw-par-new">Eigener Parameter</button>' +
      '<button class="sheet-btn" data-act="kw-back">Zurück</button>';
  }
  function paramsHtml() {
    var rows = st.keywords.map(function (k) {
      var labels = (k.params || []).map(function (p) { return p.label; }).join(", ");
      return '<div class="pref-row"><button class="kw-tap" data-act="kw-edit" data-id="' + esc(k.word) + '"><b>' + esc(k.word) +
        '</b> <span class="kw-meta">' + esc((k.process ? k.process + " · " : "") + labels) + "</span></button>" +
        '<button class="kw-del" data-act="kw-del" data-id="' + esc(k.word) + '">Löschen</button></div>';
    }).join("");
    return "<h1>Parameter</h1><p class=\"sub\">Keywords mit Eingabefenster für Arbeitsschritte</p>" +
      '<button class="add-row" data-act="kw-new"><span style="font-size:20px;line-height:1">+</span> Keyword erstellen</button>' +
      (st.keywords.length ? '<div class="card pref-card">' + rows + "</div>" : '<div class="empty">Noch keine Keywords.</div>');
  }

  // ---------- Start ----------
  renderMain();
  if (st.running) startTick();
})();
</script>
</body>
</html>
